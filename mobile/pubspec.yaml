name: monatiza
description: Monatiza — app de notícias e comunidade (Android & iOS).
publish_to: "none"
version: 3.6.0+23

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  supabase_flutter: ^2.5.0
  video_player: ^2.9.1
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  share_plus: ^10.1.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  shared_preferences: ^2.3.0
  http: ^1.2.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/emoji/

# Ícone do app (o "m" preto no branco, contraste com apps escuros) — gerado no CI.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_foreground.png"
